<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

<!-- new/Navbar  -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
      
      <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
        <img src="{{ url_for('static', filename='images/testrod.png') }}" style="height:44px; margin-right:8px;">
        <img src="{{ url_for('static', filename='images/testuncle.png') }}" style="height:44px; margin-right:12px;">
        <span class="fs-6">A.G Concrete / Golden Plasters LLC</span>
    </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/gallery">Concrete Work</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/uncle">Exterior Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact</a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="/aboutus">About Us</a>
                </li>


            </ul>
        </div>
    </div>
</nav>

<!-- Main wrapper (this removes the “empty white page” feel) -->
<div class="bg-light">

    <!-- Header section (adds structure instead of blank space) -->
    <div class="bg-dark text-white py-5">
        <div class="container text-center">
            <h1 class="fw-bold">Contact Us</h1>
            <p class="mb-0 text-light">
                Concrete • Roofing • Fencing — Free Estimates Available
            </p>
        </div>
    </div>

    <!-- Form section -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <!-- This is what removes the “flat white page” feel -->
                <div class="bg-white shadow-sm rounded p-4 p-md-5">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="name"
                                   placeholder="Enter your name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Message</label>
                            <textarea class="form-control"
                                      name="message"
                                      rows="6"
                                      placeholder="Tell us about your project..."
                                      required></textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-dark w-100">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
